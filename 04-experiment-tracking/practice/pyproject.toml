[project]
name = "titanic-tracking-seminar"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "catboost==1.2.8",
    "fastapi==0.142.2",
    "httpx>=0.28,<0.29",
    "mlflow==3.16.1",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "prometheus-client==0.26.0",
    "scikit-learn>=1.6,<2",
    "tensorboard==2.21.0",
    "uvicorn>=0.40,<0.43",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
constraint-dependencies = [
    "cryptography==46.0.7; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "starlette<1",
    "sqlalchemy<2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
