[project]
name = "caption-service-homework"
version = "0.2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "torch==2.10.0", "transformers==4.57.6", "pillow==12.1.0",
  "fastapi==0.142.2", "uvicorn>=0.40,<0.43", "httpx==0.28.1",
  "grpcio==1.84.0", "grpcio-tools==1.84.0", "pydantic>=2.12,<3",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.uv]
package = false
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'win32'"]
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
