[build-system]
requires = ["scikit-build-core==1.0.3", "pybind11==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "mlops-tensor-ops"
version = "0.1.0"
description = "Element-wise A*B+C over three 3D float64 arrays"
requires-python = ">=3.13"
dependencies = ["NumPy==2.5.3"]

[tool.scikit-build]
cmake.version = "==4.4.3"
ninja.version = "==1.13.2"
wheel.packages = ["src/tensor_ops"]
sdist.include = ["CMakeLists.txt", "cpp/**", "src/**"]
