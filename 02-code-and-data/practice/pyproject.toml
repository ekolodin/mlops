[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taxi-duration-course"
version = "0.1.0"
description = "Taxi code quality and documentation practical"
requires-python = ">=3.13"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2", "pyarrow>=18"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "sphinx", "pre-commit", "pre-commit-hooks"]

[project.scripts]
taxi-duration = "taxi_duration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

